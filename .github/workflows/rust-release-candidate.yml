name: Qt-free Rust desktop release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rust-release-candidate.yml'
      - 'apps/RustApplications.cmake'
      - 'cli/**'
      - 'tools/slint-desktop-prototype/**'
      - 'tools/terminal/build-stage.*'
      - 'assets/core-warden/animations/**'
      - 'assets/core-warden/state-contract.json'
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Stage ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      SENTINEL_NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Unix Rust toolchain
        if: runner.os != 'Windows'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install Windows Rust toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils build-essential libfontconfig1-dev libssl-dev pkg-config

      - name: Build and verify native Unix desktop stage
        if: runner.os != 'Windows'
        run: |
          stage_name="sentinel-rust-candidate-$SENTINEL_NATIVE_TARGET"
          cmake -S . -B "$RUNNER_TEMP/sentinel-rust-build" -DSENTINEL_RUST_ONLY=ON -DSENTINEL_RUST_EXPECTED_HOST="$SENTINEL_NATIVE_TARGET" -DSENTINEL_RUST_STAGE="$RUNNER_TEMP/$stage_name"
          cmake --build "$RUNNER_TEMP/sentinel-rust-build" --target sentinel-rust-stage
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tar -czf "$RUNNER_TEMP/$stage_name.tar.gz" -C "$RUNNER_TEMP" "$stage_name"
          fi

      - name: Build and verify native Windows desktop stage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageName = "sentinel-rust-candidate-$env:SENTINEL_NATIVE_TARGET"
          $build = Join-Path $env:RUNNER_TEMP 'sentinel-rust-build'
          $stage = Join-Path $env:RUNNER_TEMP $stageName
          & cmake -S . -B $build -DSENTINEL_RUST_ONLY=ON "-DSENTINEL_RUST_EXPECTED_HOST=$env:SENTINEL_NATIVE_TARGET" "-DSENTINEL_RUST_STAGE=$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build $build --target sentinel-rust-stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            & tar -czf (Join-Path $env:RUNNER_TEMP "$stageName.tar.gz") -C $env:RUNNER_TEMP $stageName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload unsigned candidate archive
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-rust-candidate-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentinel-rust-candidate-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
