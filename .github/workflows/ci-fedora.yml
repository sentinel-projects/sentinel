name: Fedora packaging CI

# Fedora 44 is the Ro-ASD product release. This workflow proves that Sentinel
# still configures, builds, installs and validates its packaging metadata on
# Fedora with distribution Qt 6 packages, independent of any Ro-ASD repository.
#
# A green Fedora container run is NOT evidence of Ro-ASD image compatibility:
# no Ro-ASD image, repository, signing or acceptance service is involved.
#
# Introduced by P7-02A and never executed on a live Fedora 44 host yet. Steps
# that depend on container capabilities (user namespaces for the bubblewrap
# sandbox, rpmlint severity handling, systemd unit dependency resolution and
# the Fedora Rust toolchain version) are marked advisory until a maintainer
# confirms a green run, after which the advisory markers should be removed.
# See docs/audits/P7_02A_FEDORA_PACKAGING_FOUNDATION_RESULT.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaging-metadata:
    name: Fedora packaging metadata
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    timeout-minutes: 20
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False git tar gzip
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False \
            python3 rpm-build desktop-file-utils appstream systemd
      - name: Validate packaging metadata consistency
        run: python3 tools/packaging/check_packaging_consistency.py
      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/dev.sentinel.Sentinel.desktop
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/linux/dev.sentinel.Sentinel.metainfo.xml
      - name: Parse RPM specs
        run: |
          set -euxo pipefail
          for spec in packaging/linux/rpm/sentinel-desktop.spec \
                      packaging/linux/fedora-kde/sentinel-desktop.spec; do
            rpmspec -P "$spec" > /dev/null
          done
      - name: Build source RPM
        run: packaging/linux/fedora-kde/build_copr.sh
      - name: Lint RPM specs (advisory)
        continue-on-error: true
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False rpmlint
          rpmlint packaging/linux/rpm/sentinel-desktop.spec \
                  packaging/linux/fedora-kde/sentinel-desktop.spec
      - name: Verify systemd user unit syntax (advisory)
        continue-on-error: true
        run: |
          set -euxo pipefail
          unit=/usr/lib/systemd/user/sentinel-desktop.service
          install -Dm0644 packaging/linux/systemd/sentinel-desktop.service "$unit"
          systemd-analyze verify "$unit"

  build-package:
    name: Fedora 44 RPM construction
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False git tar gzip
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            qt6-qtmultimedia-devel qt6-qttools-devel \
            mesa-libGL-devel vulkan-loader-devel \
            rpm-build cpio desktop-file-utils appstream python3 \
            bubblewrap dbus-daemon google-noto-sans-fonts
      - name: Prepare source RPM
        run: packaging/linux/fedora-kde/build_copr.sh
      - name: Build binary RPM and run spec checks
        run: |
          set -euxo pipefail
          rpmbuild --rebuild --define "_topdir $PWD/build-copr" \
            --define 'dist .fc44' build-copr/SRPMS/*.src.rpm
      - name: Verify RPM payload and version
        run: |
          set -euxo pipefail
          rpm_file="$(find build-copr/RPMS -name 'sentinel-desktop-[0-9]*.rpm' -print -quit)"
          test -n "$rpm_file"
          expected="$(sed -n 's/^Version:[[:space:]]*//p' packaging/linux/rpm/sentinel-desktop.spec)"
          test "$(rpm -qp --qf '%{VERSION}' "$rpm_file")" = "$expected"
          test "$(rpm -qp --qf '%{RELEASE}' "$rpm_file")" = '1.fc44'
          rpm -qp --requires "$rpm_file"
          image="$RUNNER_TEMP/sentinel-rpm-image"
          mkdir -p "$image"
          rpm2cpio "$rpm_file" | (cd "$image" && cpio -idm --quiet)
          python3 tools/packaging/check_install_manifest.py --image "$image"
          canonical="$(sed -n 's/^set(SENTINEL_APP_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          "$image/usr/bin/sentinel-daemon" --version | grep -F "$canonical"
      - name: Preserve unsigned RPM build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fedora-44-rpm-evidence
          path: |
            build-copr/RPMS/**/*.rpm
            build-copr/SRPMS/*.src.rpm
          if-no-files-found: error

  test:
    name: Fedora 44 build and test
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False git tar gzip
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            qt6-qtmultimedia-devel qt6-qttools-devel \
            mesa-libGL-devel vulkan-loader-devel \
            bubblewrap dbus-daemon google-noto-sans-fonts
      - name: Configure
        run: cmake --preset tests
      - name: Build
        run: cmake --build --preset tests
      - name: Test (advisory)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests --output-on-failure

  rust-feasibility:
    name: Fedora 44 Rust packaging feasibility
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    timeout-minutes: 20
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False git tar gzip
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe Fedora toolchain (advisory)
        continue-on-error: true
        run: |
          set -euxo pipefail
          dnf -y install --setopt=install_weak_deps=False cargo rust
          rustc --version
          cargo --version
          # The cli/ workspace pins rust-version = 1.94; report whether the
          # distribution toolchain satisfies it and whether the lockfile
          # resolves. No Rust RPM is produced by this repository yet.
          required="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' cli/Cargo.toml)"
          echo "cli/Cargo.toml rust-version: ${required}"
          python3 - "$required" <<'PY'
          import re, subprocess, sys
          required = tuple(int(part) for part in sys.argv[1].split("."))
          raw = subprocess.check_output(["rustc", "--version"], text=True).split()[1]
          available = tuple(int(part) for part in re.findall(r"\d+", raw)[:2])
          print(f"available rustc {raw} -> requirement {'.'.join(map(str, required))}")
          print("SATISFIED" if available >= required else "NOT SATISFIED: distribution toolchain is older than the pinned rust-version")
          PY
          (cd cli && cargo metadata --locked --format-version 1 > /dev/null)
          echo "cli/ lockfile resolves with the distribution toolchain"
