name: Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Releases must never be cancelled halfway through signing or publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Package Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev libvulkan-dev fonts-noto-core rpm wget
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.*'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Configure, build, and install
        run: |
          set -euo pipefail
          cmake --preset package-ready
          cmake --build --preset package-ready
          cmake --install build/package-ready --prefix "$GITHUB_WORKSPACE/dist"
      - name: Create Linux packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cpack --config build/package-ready/CPackConfig.cmake
          tar -C dist -czf "artifacts/Sentinel-Linux.tar.gz" .
          cp build/package-ready/*.deb artifacts/
          cp build/package-ready/*.rpm artifacts/
      - name: Create AppImage
        run: |
          set -euo pipefail
          # Keep deployment tools out of the application-output inventory.
          sentinel_deploy_dir="$RUNNER_TEMP/sentinel-deploy"
          mkdir -p "$sentinel_deploy_dir"
          # Fixed release URLs plus reviewed SHA-256 pins; verify before execution.
          wget --https-only --no-verbose -O "$sentinel_deploy_dir/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget --https-only --no-verbose -O "$sentinel_deploy_dir/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' | (cd "$sentinel_deploy_dir" && sha256sum -c -)
          echo '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage' | (cd "$sentinel_deploy_dir" && sha256sum -c -)
          chmod +x "$sentinel_deploy_dir/linuxdeploy-x86_64.AppImage" "$sentinel_deploy_dir/linuxdeploy-plugin-qt-x86_64.AppImage"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$sentinel_deploy_dir:$QT_ROOT_DIR/bin:$PATH"
          "$sentinel_deploy_dir/linuxdeploy-x86_64.AppImage" --appimage-extract-and-run \
            --appdir dist \
            -e dist/bin/sentinel-desktop \
            -d dist/share/applications/dev.sentinel.Sentinel.desktop \
            -i dist/share/icons/hicolor/scalable/apps/dev.sentinel.Sentinel.svg \
            --plugin qt --output appimage
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          appimage=$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          mv "$appimage" artifacts/Sentinel-Linux.AppImage
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum ./* > SHA256SUMS-Linux.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: artifacts/
          if-no-files-found: error

  macos:
    name: Package macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.*'
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Configure, build, and install
        run: |
          set -euo pipefail
          cmake --preset package-ready
          cmake --build --preset package-ready
          cmake --install build/package-ready --prefix "$GITHUB_WORKSPACE/dist"
      - name: Bundle, sign, and create DMG
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_CERT_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERT_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          app='dist/Sentinel.app'
          mv dist/sentinel-desktop.app "$app"
          test -x "$app/Contents/Helpers/sentinel-daemon"
          signing_identity='-'
          keychain=''
          cert=''
          trap 'if [ -n "$keychain" ]; then security delete-keychain "$keychain"; fi; if [ -n "$cert" ]; then rm -f -- "$cert"; fi' EXIT
          if [ -n "${APPLE_CERT_BASE64:-}" ]; then
            keychain="$RUNNER_TEMP/build.keychain"
            keychain_password=$(openssl rand -base64 24)
            printf '::add-mask::%s\n' "$keychain_password"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            cert="$RUNNER_TEMP/cert.p12"
            printf '%s' "$APPLE_CERT_BASE64" | base64 --decode > "$cert"
            security import "$cert" -k "$keychain" -P "$APPLE_CERT_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            signing_identity=$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
            test -n "$signing_identity"
          fi
          macdeployqt "$app" -qmldir=ui/qml -codesign="$signing_identity"
          python3 tools/packaging/fix_macos_helper_rpath.py \
            "$app/Contents/Helpers/sentinel-daemon" "$app/Contents/Frameworks"
          if [ "$signing_identity" != '-' ]; then
            codesign --force --deep --options runtime --entitlements packaging/macos/bundle/sentinel.entitlements --sign "$signing_identity" "$app"
          fi
          brew install create-dmg
          mkdir artifacts
          create-dmg --volname 'Sentinel Installer' --window-pos 200 120 --window-size 600 300 --icon-size 100 --icon 'Sentinel.app' 175 120 --hide-extension 'Sentinel.app' --app-drop-link 425 120 artifacts/Sentinel-macOS.dmg dist/
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASS:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit artifacts/Sentinel-macOS.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_PASS" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple artifacts/Sentinel-macOS.dmg
          fi
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 ./* > SHA256SUMS-macOS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: artifacts/
          if-no-files-found: error

  windows:
    name: Package Windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja and WiX
        shell: pwsh
        run: choco install ninja wixtoolset --no-progress --yes
      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.*'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure, build, and install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset package-ready
          if ($LASTEXITCODE -ne 0) { throw 'Packaging command failed.' }
          cmake --build --preset package-ready
          if ($LASTEXITCODE -ne 0) { throw 'Packaging command failed.' }
          cmake --install build/package-ready --prefix "$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging command failed.' }
      - name: Sign Windows payload when configured
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:WIN_CERT_BASE64)) { exit 0 }
          $certPath = "$env:RUNNER_TEMP\payload-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          try {
            # CPack reinstalls from the build tree; sign both sources and stage.
            $payloads = @(Get-ChildItem dist -Filter 'sentinel*.exe' -Recurse) + @(Get-ChildItem build/package-ready/apps -Filter 'sentinel*.exe' -Recurse)
            $payloads | ForEach-Object {
              & signtool sign /fd SHA256 /f $certPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw 'Payload signing failed.' }
            }
          } finally { Remove-Item -Force $certPath }
      - name: Bundle and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          windeployqt --qmldir ui/qml dist/sentinel-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaging command failed.' }
          cpack --config build/package-ready/CPackConfig.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Packaging command failed.' }
          $exe = Get-ChildItem build/package-ready -Filter '*.exe' | Select-Object -First 1
          $msi = Get-ChildItem build/package-ready -Filter '*.msi' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $msi) { throw 'CPack did not produce both EXE and MSI installers.' }
          Copy-Item $exe.FullName artifacts/Sentinel-Windows-x64.exe
          Copy-Item $msi.FullName artifacts/Sentinel-Windows-x64.msi
      - name: Sign Windows binaries when configured
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:WIN_CERT_BASE64)) { exit 0 }
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          try {
            Get-ChildItem artifacts -Include '*.exe', '*.msi' -Recurse | ForEach-Object {
              & signtool sign /fd SHA256 /f $certPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed.' }
            }
          } finally { Remove-Item -Force $certPath }
      - name: Generate checksums
        shell: pwsh
        run: Get-FileHash artifacts/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content -Encoding ascii artifacts/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Assemble unapproved release draft
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release"
          path: release-artifacts
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir final-artifacts
          for platform in linux macos windows; do
            (cd "release-artifacts/$platform-release" && sha256sum -c SHA256SUMS-*.txt)
          done
          for file in release-artifacts/*-release/*; do
            test -f "$file"
            name=$(basename "$file")
            test ! -e "final-artifacts/$name"
            cp -- "$file" "final-artifacts/$name"
          done
          (cd final-artifacts && cat SHA256SUMS-*.txt > SHA256SUMS.txt)
      - name: Render and validate package-manager manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/packaging/render_release_manifests.py \
            --tag "$RELEASE_TAG" \
            --dmg final-artifacts/Sentinel-macOS.dmg \
            --exe final-artifacts/Sentinel-Windows-x64.exe \
            --msi final-artifacts/Sentinel-Windows-x64.msi \
            --output-dir final-artifacts
          python3 tools/packaging/validate_release_manifests.py \
            --tag "$RELEASE_TAG" \
            --cask final-artifacts/sentinel.rb \
            --winget final-artifacts/Sopwit.Sentinel.yaml \
            --dmg final-artifacts/Sentinel-macOS.dmg \
            --exe final-artifacts/Sentinel-Windows-x64.exe \
            --msi final-artifacts/Sentinel-Windows-x64.msi
          (cd final-artifacts && sha256sum sentinel.rb Sopwit.Sentinel.yaml >> SHA256SUMS.txt)
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Maintainer verifies distribution gates before manually publishing.
          draft: true
          body: |
            Unapproved workflow draft. Passing CI and valid checksums do not establish release clearance.
            Public binary distribution remains blocked by SEC-P1.2 and SEC-P1.3.
            A maintainer must verify dependency security, privacy, licensing/source/artwork permissions,
            native acceptance, binary/resource compatibility, inventories and signing/notarization policy
            before separately approving publication. See docs/release/RELEASE_PROCESS.md.
          files: final-artifacts/*
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-pre') }}
