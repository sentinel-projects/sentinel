name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and static analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The formatting diff needs HEAD^ on push and the merge parents on PRs.
          fetch-depth: 2
      - name: Reject personal paths in public files
        run: python3 tools/analysis/check_personal_paths.py
      - name: Validate packaging metadata consistency
        run: python3 tools/packaging/check_packaging_consistency.py
      - name: Test packaging contracts
        run: python3 tests/packaging/test_packaging.py
      - name: Install build and validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy libgl1-mesa-dev libvulkan-dev fonts-noto-core desktop-file-utils appstream jq
      - name: Install clang-format
        run: |
          set -euo pipefail
          python3 -m pip install --user clang-format==18.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.*'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Check C++ formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_ref="${BASE_SHA:-HEAD^}"
          format_diff="$(git diff -U0 "$base_ref" HEAD -- \
            apps core integrations plugins tests | clang-format-diff.py -p1)"
          if [ -n "$format_diff" ]; then
            printf '%s\n' "$format_diff"
            exit 1
          fi
      - name: Validate Linux desktop metadata
        run: |
          set -euo pipefail
          desktop-file-validate packaging/linux/dev.sentinel.Sentinel.desktop
          if command -v appstreamcli >/dev/null; then
            appstreamcli validate --no-net packaging/linux/dev.sentinel.Sentinel.metainfo.xml
          elif command -v appstream-util >/dev/null; then
            appstream-util validate-relax --nonet packaging/linux/dev.sentinel.Sentinel.metainfo.xml
          else
            echo 'No AppStream validator is available.' >&2
            exit 1
          fi
      - name: Configure
        run: cmake --preset tests
      - name: Run clang-tidy on compiled Sentinel sources
        run: |
          set -euo pipefail
          jq -r --arg root "$GITHUB_WORKSPACE/" '.[] | .file | select(startswith($root + "apps/") or startswith($root + "core/") or startswith($root + "integrations/") or startswith($root + "plugins/"))' build/tests/compile_commands.json | sort -u |
            grep -E '\.(cpp|cc|cxx)$' |
            xargs -r clang-tidy -p build/tests
      - name: Run QML lint
        run: |
          set -euo pipefail
          find ui/qml -type f -name '*.qml' -print0 |
            xargs -0 -r qmllint -I ui/qml -I build/tests/apps/sentinel-desktop

  build-test:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap cmake ninja-build g++ libgl1-mesa-dev libvulkan-dev fonts-noto-core
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-sentinel-${{ github.job }}
          max-size: 500M
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.*'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake --preset tests
      - name: Build
        run: cmake --build --preset tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests --output-on-failure

  asan-build-test:
    name: AddressSanitizer build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap cmake ninja-build g++ libgl1-mesa-dev libvulkan-dev
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-sentinel-${{ github.job }}
          max-size: 500M
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.*'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Configure with ASan
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: ctest --preset asan --output-on-failure
