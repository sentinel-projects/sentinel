name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (macOS)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject personal paths in public files
        run: python3 tools/analysis/check_personal_paths.py
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ${{ runner.os }}-sentinel-${{ github.job }}
          max-size: 500M
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.*'
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake --preset tests
      - name: Build
        run: cmake --build --preset tests
      - name: Verify packaged bundle layout
        run: |
          set -euo pipefail
          python3 tools/packaging/check_packaging_consistency.py
          cmake --install build/tests --prefix "$RUNNER_TEMP/sentinel-install"
          test -x "$RUNNER_TEMP/sentinel-install/sentinel-desktop.app/Contents/Helpers/sentinel-daemon"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests --output-on-failure
