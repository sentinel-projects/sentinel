[package]
name = "sentinel-daemon-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sentinel-ipc.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
tokio = { version = "1.54", features = ["rt", "time", "macros", "net"] }
base64 = "0.22.1"
sha2 = "0.10.9"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "backup", "serialize"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
roxmltree = "0.21.2"
lopdf = { version = "0.47.0", default-features = false }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Pipes"] }
