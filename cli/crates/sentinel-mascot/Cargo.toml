[package]
name = "sentinel-mascot"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
ratatui-image = { version = "=11.1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["event", "stdio", "fs", "termios"] }
